services:
  minibus-api:
    build:
      context: .
      dockerfile: backend/FullFilled.Api/Dockerfile
    container_name: minibus-api
    restart: unless-stopped
    env_file:
      - backend/FullFilled.Api/.env
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - minibus-data:/data
    mem_limit: 768m
    cpus: 1.0

volumes:
  minibus-data:

